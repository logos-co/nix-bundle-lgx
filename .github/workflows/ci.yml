name: CI

# This repo had no automated gate at all, which is a poor fit for where it
# sits: it is the last step before an artifact reaches a user, and a .lgx
# records no nix closure, so nothing downstream can notice that the payload it
# unpacks is unrunnable. `nix build` is happy either way -- the build host has
# /nix/store, so the package "works" there no matter how it was linked.
#
# tests/smoke.sh packages a deliberately tiny module, verifies and extracts it,
# asserts the payload's contract, and then runs the extracted binary on two
# distros that are not the build host. The cross-distro run is why this belongs
# in CI: an .lgx that unpacks but whose binary cannot exec elsewhere is the
# exact failure this guards, and it cannot be seen from the build.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    name: lgx payload contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and aarch64 carry DIFFERENT psABI loader paths
        # (/lib64/ld-linux-x86-64.so.2 vs /lib/ld-linux-aarch64.so.1), and the
        # obvious "just use /lib64" for both silently breaks arm. The payload
        # is where that lands, so both architectures have to package and run.
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: Flake checks
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build -L ".#checks.$system.payload-closure" ".#checks.$system.root-assets"

      - name: Payload contract + cross-distro run
        env:
          # Pin tags so a moving :latest cannot invent unrelated failures.
          # Override locally with SMOKE_DISTROS if you want something else.
          SMOKE_DISTROS: ubuntu:24.04 fedora:42
        run: |
          nix shell nixpkgs#patchelf nixpkgs#binutils \
            -c bash tests/smoke.sh .
